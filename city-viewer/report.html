<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11151c">
  <title>数据报告 · 百度街景工作台</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/report.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./" aria-label="返回百度街景工作台"><span class="brand-mark" aria-hidden="true">B</span><span>百度街景工作台</span></a><div class="source-state" id="report-source" role="status"><span class="state-dot"></span><span>百度元数据源：读取中</span></div><nav class="top-actions" aria-label="主导航"><a class="nav-link" href="./">地图工作台</a></nav></header>
  <main class="report-page">
    <section class="report-head"><div><p class="eyebrow">数据概览</p><h1 class="report-title">数据报告 · 百度街景目录</h1><p class="report-subtitle">统计已发布的城市元数据；分类依据构建清单字段，不代表影像拓扑验证。</p></div><div class="report-status" id="report-total" data-ready="false">读取目录中…</div></section>
    <section class="summary-cards" id="summary-cards" aria-label="分类汇总"><article class="summary-card"><span>总点位</span><strong id="summary-total">—</strong></article><article class="summary-card"><span>常规</span><strong id="summary-regular">—</strong></article><article class="summary-card"><span>隐藏</span><strong id="summary-hidden">—</strong></article><article class="summary-card"><span>时光机</span><strong id="summary-time-machine">—</strong></article><article class="summary-card"><span>未知</span><strong id="summary-unknown">—</strong></article></section>
    <div id="overall-bar"></div><p id="report-coverage" class="report-note"></p><p class="report-note">隐藏、时光机为源文件对主记录的标注，彼此互斥；不按时间线长度猜测，不把元数据标记当作官网影像可用证明。冲突观察版本不重复计入点位。本地导入不计入报告。</p>
    <section class="report-controls" aria-label="报告筛选"><label class="report-search"><span>搜索城市或省份</span><input id="report-search" type="search" placeholder="输入名称筛选"></label><label class="hidden-toggle"><input id="report-hidden-only" type="checkbox"> 仅显示隐藏点位城市</label><div class="sort-controls" role="group" aria-label="排序"><button class="report-sort active" data-sort="province" type="button">省份</button><button class="report-sort" data-sort="total" type="button">总点位</button><button class="report-sort" data-sort="hidden" type="button">隐藏</button><button class="report-sort" data-sort="timeMachine" type="button">时光机</button></div></section>
    <div class="report-fold-controls"><button id="report-expand" type="button">展开全部</button><button id="report-collapse" type="button">收起全部</button><span id="filter-summary"></span></div>
    <section class="province-groups" id="province-groups" aria-label="省市分类报告"></section>
    <div id="report-empty" class="report-empty" hidden><strong>尚无已发布点位</strong>等待用户提供并审核百度街景元数据。</div>
  </main>
  <div id="report-error" role="status" aria-live="polite"></div>
  <script type="module" src="./js/report.js"></script>
</body>
</html>
